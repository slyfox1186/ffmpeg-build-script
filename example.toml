# Copy this template to custom.toml, edit it, and then run:
# bash build-ffmpeg.sh --build --config ./custom.toml
#
# This project accepts a deliberately small TOML subset:
#   [build]
#   [packages]
#   key = true|false
#
# Package entries are an explicit allowlist: an omitted key is disabled. A true
# value either builds the component from source or requests its supported system
# development package, depending on the integration. Some source-built
# dependencies can fall back to compatible system libraries when disabled.
#
# The groups below are for readability; they do not control build order. The
# scripts resolve dependencies and build stages independently of TOML ordering.
# GPL/non-free authorization does not turn disabled packages on. Conversely,
# packages that require that authorization remain inactive until
# enable_gpl_and_non_free is true or --enable-gpl-and-non-free is passed.
#
# The build context records these choices. After changing this file for an
# existing workspace, clean that same build root before rebuilding:
# bash build-ffmpeg.sh --cleanup

[build]
# Recheck upstream releases and rebuild components whose recorded versions differ.
latest = false

# Authorize GPL and non-free FFmpeg components; review licensing before enabling.
enable_gpl_and_non_free = false

[packages]

# Build systems, code generators, assemblers, and packaging tools
m4 = true
autoconf = true
automake = true
libtool = true
pkgconf = true
cmake = true
meson = true
ninja = true
yasm = true
nasm = true
ant-git = true

# Compression, parsing, allocation, and other foundational libraries
libzstd = true
zlib = true
brotli = true
libiconv = true
libxml2 = true
pcre2 = true
jemalloc = true
gflags = true

# Cryptography, TLS, name resolution, and network protocols
# GnuTLS uses GMP and Nettle. OpenSSL is an alternative TLS integration.
gmp = true
nettle = true
gnutls = true
openssl = false
c-ares = true
librist = true         # Reliable Internet Stream Transport
srt = false            # Secure Reliable Transport
libssh = true          # SFTP protocol (system development package)
librtmp = true         # RTMP[E] protocol (system development package)
libsmbclient = true    # SMB/CIFS; effective only in GPL/non-free mode

# Fonts, subtitles, captions, teletext, and text recognition
freetype = true
fontconfig = true
harfbuzz = true
fribidi = true
libass = true
libaribb24 = false     # ARIB STD-B24 caption decoding
libzvbi = true         # Teletext (system development package)
libtesseract = true    # OCR filter (system development package)

# Still-image codecs, color management, and image containers
giflib = true
libpng = true
libtiff = true
libjpeg-turbo = true
libwebp-git = true
libhwy = true          # Highway SIMD dependency used by JPEG XL
lcms2 = true           # Little CMS color management
libjxl = true          # JPEG XL (system development package)
librsvg = true         # SVG rasterization (system development package)
openjpeg = true        # JPEG 2000
avif = true            # AVIF image container
libheif = true         # HEIF/AVIF image container

# Audio codecs and audio container formats
libogg = true
libfdk-aac = false     # Fraunhofer AAC; requires non-free authorization
vorbis = true
libopus = true
opencore-amr = true
liblame = true         # MP3 encoding
libspeex = true        # Speex (system development package)
libshine = true        # Fixed-point MP3 encoder (system development package)
libtwolame = true      # MP2 encoding (system development package)
libvo-amrwbenc = true  # AMR-WB encoding (system development package)
libgsm = true          # GSM audio (system development package)

# Audio resampling, analysis, effects, and synthesis
libsoxr = true
libsndfile = true
libmysofa = true       # SOFA-based spatial audio
rubberband-git = false # Time stretching and pitch shifting
chromaprint = true     # Audio fingerprinting (system development package)
libmodplug = true      # Tracker modules (system development package)
libgme = true          # Game-music emulation (system development package)
libbs2b = true         # Stereo-to-binaural processing (system development package)
libopenmpt = true      # Tracker modules (system development package)
libflite = true        # Text-to-speech (system development package)

# Audio plugin standards and the LV2 dependency stack
lv2-git = true
serd = true
zix = true
sord = true
sratom = true
lilv = true
ladspa = true          # LADSPA filters (system development package)

# Audio devices and sound servers
libjack = true         # JACK (system development package)
alsa = true            # ALSA (system development package)
libpulse = true        # PulseAudio (system development package)
sndio = true           # sndio (system development package)

# Video codecs and codec support libraries
libtheora = true
av1-git = true         # Alliance for Open Media AV1 (libaom)
rav1e = true           # Rust AV1 encoder
kvazaar = true         # HEVC encoder
x264 = false           # H.264 encoder; requires GPL authorization
x265 = false           # HEVC encoder; requires GPL authorization
xvidcore = false       # MPEG-4 Part 2 encoder
svt-av1 = true
libgav1-git = true     # AV1 decoder
libvpx = true          # VP8/VP9 (system development package)
libdav1d = true        # AV1 decoder (system development package)
libopenh264 = true     # Cisco H.264 encoder (system development package)
libsnappy = true       # Required for HAP decoding (system development package)

# Video processing, quality analysis, and scripting frameworks
zimg-git = true        # Scaling, colorspace conversion, and dithering
libvmaf = true         # Video quality metrics
vid-stab = false       # Video stabilization
frei0r = true          # Video filters; effective only in GPL/non-free mode
avisynth = false       # AviSynth script input
vapoursynth = true     # VapourSynth script input

# Optical media, containers, packaging, and metadata tools
libdvdread = true
udfread = true
zenlib = true
mediainfo-lib = true
mediainfo-cli = true
gpac-git = true        # MP4/ISOBMFF tools
libbluray = true       # Blu-ray access (system development package)
libcdio = true         # Audio CD input; effective only in GPL/non-free mode

# Playback, capture, window systems, and visual output
sdl2 = true            # Enables ffplay when available
freeglut = true
libcaca = true         # Text/ASCII video output (system development package)
libv4l2 = true         # Video4Linux2 capture (system development package)
xlib = true            # X11/XCB capture (system development packages)
opengl = true          # OpenGL output (system development package)

# GPU APIs, codec SDK headers, and hardware acceleration
# CUDA toolkit installation is controlled separately with CUDA_INSTALL.
opencl-sdk-git = true
vulkan-headers-git = true # Source-built Vulkan headers required by Vulkan support
vulkan = true             # Vulkan hwaccel and filters (system loader)
libshaderc = true         # SPIR-V compiler for Vulkan filters
libplacebo = true         # GPU scaling and tone mapping through Vulkan
nv-codec-headers = false  # NVIDIA NVENC/NVDEC headers; requires GPL/non-free mode
amf-headers = false       # AMD AMF headers
vaapi = true              # VA-API (system development package)
libvpl = true             # Intel oneVPL/Quick Sync (system development package)
libdrm = true             # Linux DRM contexts (system development package)
vdpau = true              # VDPAU (system development package)

# Final application
ffmpeg = true
