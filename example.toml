# Copy this file and pass it with:
# bash build-ffmpeg.sh --build --config ./example.toml
#
# Supported TOML shape:
#   [build]
#   [packages]
#   key = true|false
#
# CLI flags still override config values.
# Disabled local packages will use supported system packages when available.
# If a disabled package breaks a required dependency chain, the script will fail early.
# If you change package selections on an existing workspace, run:
#   bash build-ffmpeg.sh --cleanup

[build]
latest = true
enable_gpl_and_non_free = false

[packages]
m4 = true
autoconf = true
automake = true
libtool = true
pkgconf = true
cmake = true
meson = true
ninja = true
libzstd = true
librist = true
zlib = true
openssl = false
yasm = true
nasm = true
giflib = true
libiconv = true
libxml2 = true
libpng = true
libtiff = true
libaribb24 = false
gmp = true
nettle = true
gnutls = true
freetype = true
fontconfig = true
harfbuzz = true
fribidi = true
libass = true
freeglut = true
libwebp-git = true
libhwy = true
brotli = true
lcms2 = true
gflags = true
opencl-sdk-git = true
libjpeg-turbo = true
rubberband-git = false
c-ares = true
lv2-git = true
waflib = true
serd = true
pcre2 = true
zix = true
sord = true
sratom = true
jemalloc = true
libsoxr = true
sdl2 = true
libsndfile = true
libogg = true
libfdk-aac = false
vorbis = true
libopus = true
libmysofa = true
opencore-amr = true
liblame = true
libtheora = true
av1-git = true
rav1e = true
zimg-git = true
avif = true
kvazaar = true
libdvdread = true
udfread = true
ant-git = true
zenlib = true
mediainfo-lib = true
mediainfo-cli = true
vid-stab = false
x264 = false
x265 = false
nv-codec-headers = false
vaapi = true
amf-headers = false
srt = false
avisynth = false
xvidcore = false
gpac-git = true
svt-av1 = true
vapoursynth = true
libgav1-git = true
libheif = true
openjpeg = true
libbluray = true
libvpx = true

# System libraries (provided by the -dev packages installed in system-setup.sh).
# Enabled by default; set to false to omit a given library from FFmpeg's configure.
# Skipped automatically if the dev package is absent on your distro.
libdav1d = true        # AV1 decoding (dav1d)
libvpl = true          # Intel Quick Sync (oneVPL) hw enc/dec
libspeex = true        # Speex speech codec
libssh = true          # SFTP protocol
chromaprint = true     # audio fingerprinting
libjxl = true          # JPEG XL (only present on distros shipping libjxl-dev)
libtesseract = true    # OCR filter
libzvbi = true         # teletext
libmodplug = true      # tracker music
libgme = true          # game-music emu
libshine = true        # fixed-point MP3 encoder
libcaca = true         # ASCII-art output
libbs2b = true         # Bauer stereo-to-binaural
libjack = true         # JACK audio
libv4l2 = true         # Video4Linux2 capture
xlib = true            # X11 grabbing (x11grab)
libsnappy = true       # Snappy (needed for HAP)
libtwolame = true      # MP2 encoding
libvo-amrwbenc = true  # AMR-WB encoding
libgsm = true          # GSM audio
ladspa = true          # LADSPA audio filters
opengl = true          # OpenGL output device
frei0r = true          # frei0r video filters (GPL; only with --enable-gpl-and-non-free)
libopenh264 = true     # H.264 encoder (Cisco OpenH264)
libopenmpt = true      # tracker music decoding
librtmp = true         # RTMP[E] streaming protocol
librsvg = true         # SVG rasterization
libflite = true        # text-to-speech (flite)
alsa = true            # ALSA audio I/O
libpulse = true        # PulseAudio input
sndio = true           # sndio audio I/O
libvmaf = true         # VMAF quality metric (built from source; not packaged for apt)
vulkan-headers = true  # latest Vulkan headers (built from source; required for vulkan)
vulkan = true          # Vulkan hwaccel + GPU filters
libshaderc = true      # SPIR-V compiler for the Vulkan filters
libplacebo = true      # GPU tonemap/scale via vf_libplacebo (needs vulkan + libplacebo>=5.229)

ffmpeg = true
