[project]
name = "ffmpeg-build-script"
version = "8.1.0"
description = "A configurable FFmpeg source builder with a terminal package menu"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
menu = ["textual>=8.2.8"]
dev = ["pytest==9.1.1", "ruff==0.16.8", "mypy==2.3.1", "pyte==0.8.2"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ffmpeg_build*"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["build-ffmpeg.py", "run_linter.py", "ffmpeg_build/**/*.py", "tests/**/*.py", "tools/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["build-ffmpeg.py", "run_linter.py", "ffmpeg_build", "tools", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
