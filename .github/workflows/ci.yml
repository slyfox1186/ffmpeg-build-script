name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install fixture prerequisites
        run: |
          sudo apt -o APT::Cmd::Disable-Script-Warning=1 update
          sudo apt -o APT::Cmd::Disable-Script-Warning=1 install \
            --assume-yes --no-install-recommends pkgconf util-linux coreutils

      - name: Install development tools
        run: python -m pip install '.[menu,dev]'

      - name: Run static analysis
        run: python run_linter.py

      - name: Run regression tests
        run: python -m pytest
